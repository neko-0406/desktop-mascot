[workspace]
resolver = "2"
members = [
    "crates/mascot-format",
    "crates/mascot-renderer",
    "crates/mascot-physics",
    "crates/mascot-app",
    "crates/mascot-importer",
]

[workspace.dependencies]
mascot-format = { path = "crates/mascot-format" }
mascot-renderer = { path = "crates/mascot-renderer" }
mascot-physics = { path = "crates/mascot-physics" }

# Third-party dependencies
bytemuck = { version = "1.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
wgpu = "30.0.1"
winit = "0.30.13"
glam = { version = "0.29", features = ["bytemuck"] }
pollster = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }


